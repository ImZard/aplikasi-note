<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid deep ink background -->
  <rect width="512" height="512" rx="64" fill="#0f172a"/>
  <!-- Crisp inner border -->
  <rect x="8" y="8" width="496" height="496" rx="56" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Paper surface -->
  <rect x="136" y="96" width="240" height="320" rx="12" fill="#ffffff"/>
  <!-- Top header accent -->
  <rect x="136" y="96" width="240" height="28" rx="12" fill="#e2e8f0"/>
  <rect x="136" y="112" width="240" height="12" fill="#e2e8f0"/>
  <!-- Ruled lines -->
  <line x1="172" y1="168" x2="340" y2="168" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="172" y1="216" x2="340" y2="216" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="172" y1="264" x2="340" y2="264" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="172" y1="312" x2="280" y2="312" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <!-- Check indicator mark -->
  <circle cx="340" cy="356" r="28" fill="#0f172a"/>
  <polyline points="328 356 337 365 354 348" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
